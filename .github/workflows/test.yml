name: Test pgkv Extension

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        postgres-version: [12, 13, 14, 15, 16]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start PostgreSQL ${{ matrix.postgres-version }}
        run: |
          docker run -d \
            --name postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=test \
            -p 5432:5432 \
            postgres:${{ matrix.postgres-version }}

          # Wait for PostgreSQL to be ready
          until docker exec postgres pg_isready -U postgres; do
            sleep 1
          done

      - name: Install pgTAP
        run: |
          docker exec postgres bash -c "apt-get update && apt-get install -y postgresql-${{ matrix.postgres-version }}-pgtap"

      - name: Copy extension files to container
        run: |
          docker cp pgkv.control postgres:/tmp/
          for sql in pgkv--*.sql; do
            docker cp "$sql" "postgres:/tmp/$sql"
          done

      - name: Install extension files
        run: |
          docker exec postgres bash -c "
            cp /tmp/pgkv.control /usr/share/postgresql/${{ matrix.postgres-version }}/extension/
            cp /tmp/pgkv--*.sql /usr/share/postgresql/${{ matrix.postgres-version }}/extension/
          "

      - name: Create extension in database
        run: |
          docker exec postgres psql -U postgres -d test -c "CREATE EXTENSION pgkv;"

      - name: Run pgTAP tests
        run: |
          set -o pipefail
          for test_file in tests/[0-9]*.sql; do
            case "$test_file" in
              tests/[0-9][0-9]-upgrade-*.sql) continue ;;
            esac
            echo "Running $test_file..."
            docker exec -i postgres psql -U postgres -d test -v ON_ERROR_STOP=1 -At < "$test_file" | tee /tmp/pgtap.out
            if grep -Eq '^not ok|^# Looks like' /tmp/pgtap.out; then
              echo "::error::$test_file failed"
              exit 1
            fi
          done

      - name: Test upgrade paths
        run: |
          set -o pipefail
          for test_file in tests/[0-9][0-9]-upgrade-*.sql; do
            echo "Running $test_file..."
            docker exec -i postgres psql -U postgres -d test -v ON_ERROR_STOP=1 -At < "$test_file" | tee /tmp/upgrade.out
            if grep -q '^bad' /tmp/upgrade.out; then
              echo "::error::$test_file failed"
              exit 1
            fi
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run stress and two-session atomicity tests
        env:
          PGKV_DSN: postgresql://postgres:postgres@localhost:5432/test
        run: |
          pip install -q -r stress/requirements.txt
          pytest -q stress

      - name: Cleanup
        if: always()
        run: |
          docker stop postgres
          docker rm postgres
